<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plague horizon - Play</title>
    <link rel="stylesheet" href="style.css" />
    <script src="auth.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">
        <img src="zombie.png" alt="Plague horizon logo" />
        <span>PLAGUE HORIZON</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="Leaderboard.html">Leaderboard</a>
        <a id="nav-auth-link" href="login.html">Login/Register</a>
        <a class="active" href="play.html" id="nav-play-link">Play</a>
        <button type="button" class="btn btn-ghost nav-logout" id="nav-logout">
          Log out
        </button>
      </nav>
    </header>

    <main style="display: flex; flex-direction: column; min-height: 100vh;">
      <h1 class="page-title">Play</h1>
      <p class="page-sub">
        WASD to move · mouse to aim · click or Space to shoot · P to pause
      </p>

      <section class="play-stage" tabindex="-1" aria-label="Game area">
        <div class="game-wrap">
          <div id="game-hud" class="game-hud" hidden>
            <div class="game-hud__item">
              <span class="game-hud__label">Lives</span>
              <span id="hud-lives" class="game-hud__lives" aria-label="Lives remaining"></span>
            </div>
            <div class="game-hud__item">
              <span class="game-hud__label">Ammo</span>
              <span id="hud-ammo" class="game-hud__value">0</span>
            </div>
            <div class="game-hud__item">
              <span class="game-hud__label">Score</span>
              <span id="hud-score" class="game-hud__value">0</span>
            </div>
            <div class="game-hud__item">
              <span class="game-hud__label">Wave</span>
              <span id="hud-wave" class="game-hud__value">1</span>
            </div>
            <div class="game-hud__item">
              <span class="game-hud__label">Time</span>
              <span id="hud-time" class="game-hud__value">0:00</span>
            </div>
          </div>
          <canvas id="game-canvas" width="900" height="500" aria-label="Zombie survival game"></canvas>
          <div id="game-overlay" class="game-overlay">
            <h2 id="overlay-title" class="game-overlay__title">Plague Horizon</h2>
            <p id="overlay-text" class="game-overlay__text">
              Survive the horde. Zombies often drop ammo when killed.
            </p>
            <button type="button" class="btn btn-primary" id="overlay-btn">Start game</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">&copy; 2026 Plague horizon. All rights reserved</footer>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (!window.PHAuth || !window.PHAuth.getUser()) {
          window.location.replace("login.html?next=play.html");
          return;
        }
        if (window.PHGame) {
          window.PHGame.init();
        }

        // Ensure the overlay Start button always starts the game and scrolls into view.
        var overlayBtn = document.getElementById("overlay-btn");
        if (overlayBtn) {
          overlayBtn.addEventListener("click", function () {
            var stage = document.querySelector(".play-stage");
            if (stage) {
              stage.scrollIntoView({ behavior: "smooth", block: "center" });
            }
            if (window.PHGame && typeof window.PHGame.start === "function") {
              window.PHGame.start();
            }
          });
        }
      });
    </script>
  </body>
</html>
