<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plague Horizon - Register</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js" defer></script>
</head>
<body>

    <header class="site-header">
      <a class="brand" href="index.html">
        <img
          src="zombie.png"
          alt="Plague horizon logo"
        />
        <span>PLAGUE HORIZON</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="index.html">Home</a>
        <a href="Leaderboard.html">Leaderboard</a>
        <a id="nav-auth-link" href="login.html">Login/Register</a>
        <a href="play.html" id="nav-play-link">Play</a>
        <button type="button" class="btn btn-ghost nav-logout" id="nav-logout">
          Log out
        </button>
      </nav>
    </header>

    <main>
        <h1 class="page-title">Create account</h1>
        <p class="page-sub">Register to save progress and compete on the leaderboard.</p>

        <div class="grid-2" style="align-items: start">
            <figure class="img-frame">
                <img
                    src="game photo 2.jfif"
                    alt="New survivor entering Plague Horizon arena"
                    width="800"
                    height="450"
                />
                <figcaption class="img-caption">
                    New accounts can jump straight into ranked matches.
                </figcaption>
            </figure>

            <section class="panel form-stack">
                <h2>Register</h2>
                <form class="register-form">
                    <p id="register-feedback" class="form-feedback" aria-live="polite" hidden></p>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Choose your username" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="region">Region</label>
                        <input type="text" id="region" name="region" placeholder="e.g. NA, EU, ASIA" required>
                    </div>

                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" placeholder="Enter your age" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Confirm password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Register</button>
                        <a href="login.html" class="btn btn-ghost">Login instead</a>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <footer class="site-footer">&copy; 2026 Plague horizon. All rights reserved</footer>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var form = document.querySelector(".register-form");
        var feedback = document.getElementById("register-feedback");
        if (!form) return;

        function setFeedback(message, variant) {
          if (!feedback) return;
          variant = variant || "error";
          if (!message) {
            feedback.hidden = true;
            feedback.textContent = "";
            feedback.className = "form-feedback";
            feedback.removeAttribute("role");
            return;
          }
          feedback.hidden = false;
          feedback.textContent = message;
          feedback.className = "form-feedback form-feedback--" + variant;
          feedback.setAttribute("role", variant === "success" ? "status" : "alert");
        }

        // Check if user is already logged in
        if (window.PHAuth && window.PHAuth.getUser()) {
          setFeedback("You are already logged in.", "neutral");
          // Disable the register form
          var inputs = form.querySelectorAll("input, button");
          inputs.forEach(function(input) {
            input.disabled = true;
          });
          // Disable the login link
          var loginLink = document.querySelector('a[href="login.html"]');
          if (loginLink) {
            loginLink.style.pointerEvents = "none";
            loginLink.style.opacity = "0.5";
          }
        }

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          setFeedback("");
          if (!window.PHAuth) {
            setFeedback("Could not load registration. Please refresh the page.");
            return;
          }
          var password = document.getElementById("password").value;
          var confirmPassword = document.getElementById("confirm-password").value;
          if (password !== confirmPassword) {
            setFeedback("Passwords do not match.");
            return;
          }
          var result = window.PHAuth.registerAccount({
            username: document.getElementById("username").value,
            email: document.getElementById("email").value,
            region: document.getElementById("region").value,
            age: document.getElementById("age").value,
            password: password,
            registeredAt: Date.now(),
          });
          if (!result.ok) {
            if (result.reason === "duplicate") {
              setFeedback("That username or email is already registered.");
            } else {
              setFeedback("Please fill in username and email.");
            }
            return;
          }
          setFeedback("Registration successful. You can now log in.", "success");
          e.target.reset();
        });
      });
    </script>
</body>
</html>
